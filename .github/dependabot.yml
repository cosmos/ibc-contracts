version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: main
    schedule:
      interval: weekly
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: gomod
    directories:
      - "/**/*"
    target-branch: main
    schedule:
      interval: weekly

name: foundry-setup

runs:
  using: composite
  steps:
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        toolchain: stable
        components: rustfmt, clippy
    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
    - name: Install the Node.js dependencies
      uses: nick-invision/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
      with:
        timeout_minutes: 10
        max_attempts: 3
        retry_wait_seconds: 5
        command: cd ibc-solidity && bun install
    - name: Setup Protoc
      uses: taiki-e/install-action@312abea5c48d4b2c63c1b730153f73b8c69e1123 # protoc

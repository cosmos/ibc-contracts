# SPDX-License-Identifier: Apache-2.0

name: e2e-build
description: Builds and caches the SP1, proof-api, operator and Solana artifacts the E2E suites consume

inputs:
  github_token:
    description: A Github PAT
    required: true
  component:
    description: >-
      Which artifacts to build: `rust` (SP1 programs, proof-api, operator) or `solana`
      (Solana programs). Run both as parallel matrix legs; e2e-setup merges their artifacts.
    required: true

runs:
  using: composite
  steps:
    - name: Check component
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
      run: |
        if [[ "$COMPONENT" != 'rust' && "$COMPONENT" != 'solana' ]]; then
          echo "::error::e2e-build: component must be 'rust' or 'solana', got '$COMPONENT'"
          exit 1
        fi

    # Look up every cached artifact first; tooling is only set up for what missed, so a full
    # cache hit skips the disk cleanup, toolchain installs and the 1-2 GB SP1 toolchain restore.
    # `!packages/go-*/**` keeps Go-only changes (generated bindings) from invalidating Rust builds.
    - name: Cache SP1 Programs
      if: inputs.component == 'rust'
      id: cache-sp1-programs
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ibc-solidity/programs/sp1-programs/target/elf-compilation/riscv64im-succinct-zkvm-elf/release/*
        # Path deps reach into packages/ (which inherit from the root Cargo.toml) and sol! reads
        # the ABIs and msgs contracts, so all of them invalidate the ELFs.
        key: ${{ runner.os }}-sp1-programs-${{ hashFiles('ibc-solidity/programs/sp1-programs/**', 'packages/**', '!packages/go-*/**', 'ibc-solidity/abi/**', 'ibc-solidity/contracts/**/msgs/**', 'Cargo.toml', 'Cargo.lock') }}

    - name: Cache Proof API
      if: inputs.component == 'rust'
      id: cache-proof-api
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cargo/bin/proof-api
        # Also covers what packages/ pulls in: sol! ABIs and msgs contracts, protos, and the
        # ibc-solana path deps with the workspace manifest they inherit from.
        key: ${{ runner.os }}-proof-api-${{ hashFiles('programs/proof-api/**', 'packages/**', '!packages/go-*/**', 'ibc-solana/packages/**', 'ibc-solana/Cargo.toml', 'ibc-solidity/abi/**', 'ibc-solidity/contracts/**/msgs/**', 'proto/**', 'Cargo.toml', 'Cargo.lock') }}

    - name: Cache Operator
      if: inputs.component == 'rust'
      id: cache-operator
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cargo/bin/operator
        key: ${{ runner.os }}-operator-${{ hashFiles('ibc-solidity/programs/operator/**', 'packages/**', '!packages/go-*/**', 'ibc-solana/packages/**', 'ibc-solana/Cargo.toml', 'ibc-solidity/abi/**', 'ibc-solidity/contracts/**/msgs/**', 'proto/**', 'Cargo.toml', 'Cargo.lock') }}

    # Restore-only here; saved below on main alone, for the same quota reason as the Rust
    # build state. Keep `path` in sync with the save step. Build outputs only: the Solana and
    # Anchor toolchains are cached by setup-all, and only needed on a miss. The key takes all of
    # ibc-solana/ (so new build inputs count by default) minus the host-only integration tests
    # and docs.
    - name: Restore Solana Programs
      if: inputs.component == 'solana'
      id: cache-solana
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ./ibc-solana/target/deploy/
          ./ibc-solana/target/sbpf-solana-solana/
        key: ${{ runner.os }}-solana-${{ env.SOLANA_VERSION }}-${{ env.ANCHOR_VERSION }}-${{ hashFiles('ibc-solana/**', '!ibc-solana/integration-tests/**', '!ibc-solana/**/*.md', '!ibc-solana/target/**', 'packages/tendermint-light-client/**', 'packages/constrained_types/**', 'Cargo.toml', 'proto/**', 'ibc-solidity/abi/IFTOwnable.json', 'ibc-solidity/contracts/light-clients/attestation/msgs/**', 'ibc-solidity/contracts/msgs/**', 'scripts/build-solana-test-instance.sh', 'solana-keypairs/localnet/**', 'justfile') }}
        restore-keys: |
          ${{ runner.os }}-solana-${{ env.SOLANA_VERSION }}-${{ env.ANCHOR_VERSION }}-

    - name: Check what needs building
      id: plan
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
        SP1_HIT: ${{ steps.cache-sp1-programs.outputs.cache-hit }}
        PROOF_API_HIT: ${{ steps.cache-proof-api.outputs.cache-hit }}
        OPERATOR_HIT: ${{ steps.cache-operator.outputs.cache-hit }}
        SOLANA_HIT: ${{ steps.cache-solana.outputs.cache-hit }}
      run: |
        bins=false
        if [[ "$COMPONENT" == 'rust' && ( "$PROOF_API_HIT" != 'true' || "$OPERATOR_HIT" != 'true' ) ]]; then bins=true; fi
        build=true
        if [[ "$COMPONENT" == 'rust' && "$SP1_HIT" == 'true' && "$bins" == 'false' ]]; then build=false; fi
        if [[ "$COMPONENT" == 'solana' && "$SOLANA_HIT" == 'true' ]]; then build=false; fi
        echo "build=$build" >> "$GITHUB_OUTPUT"
        echo "bins=$bins" >> "$GITHUB_OUTPUT"

    - name: Free disk space
      if: steps.plan.outputs.build == 'true'
      uses: ./.github/actions/free-disk-space
      with:
        # Neither leg uses Docker; only the cargo/anchor target dirs need the room.
        prune-docker-images: false

    # Rust, protoc and the rest; both the SP1/Rust builds and the Solana build need them.
    - name: Set up foundry tooling
      if: steps.plan.outputs.build == 'true'
      uses: ./.github/actions/foundry-setup

    - name: Wait for disk space
      if: steps.plan.outputs.build == 'true'
      uses: ./.github/actions/free-disk-space-wait

    - name: Cache Rust build state
      if: steps.plan.outputs.bins == 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        # Also restored by rust.yml's build-proof-api/build-operator jobs; written only here,
        # where both binaries are built, so the entry covers both. Placed before the SP1
        # toolchain install: rust-cache keys on every installed rustup toolchain, and rust.yml
        # has only stable, so `succinct` must not be installed yet when the key is computed.
        shared-key: release-bins
        cache-on-failure: true
        cache-bin: false
        # ~2 GB per entry: only main writes it (PRs can read main's caches), so PR
        # branches don't churn the repo's cache quota and evict each other.
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Cache SP1 Toolchain
      if: inputs.component == 'rust' && steps.cache-sp1-programs.outputs.cache-hit != 'true'
      id: cache-sp1-toolchain
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.sp1
          ~/.rustup/toolchains/succinct
        key: ${{ runner.os }}-sp1-toolchain-${{ env.SP1_VERSION }}

    - name: Install SP1 toolchain
      if: inputs.component == 'rust' && steps.cache-sp1-programs.outputs.cache-hit != 'true' && steps.cache-sp1-toolchain.outputs.cache-hit != 'true'
      uses: nick-invision/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
      with:
        timeout_minutes: 10
        max_attempts: 3
        retry_wait_seconds: 5
        command: |
          curl -L https://sp1.succinct.xyz | bash
          ~/.sp1/bin/sp1up --version ${{ env.SP1_VERSION }} --token ${{ inputs.github_token }}

    - name: Install just
      if: steps.plan.outputs.build == 'true'
      uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0

    - name: Build SP1 Programs
      if: inputs.component == 'rust' && steps.cache-sp1-programs.outputs.cache-hit != 'true'
      shell: bash
      run: just solidity::build-sp1-programs

    # One cargo invocation for both binaries, so their shared dependencies compile once and
    # in parallel. Workspace-level `--bin` (no `-p`), like rust.yml and the Dockerfile, so
    # features resolve across the whole workspace and the binaries match the shipped ones.
    - name: Build proof API and operator
      if: steps.plan.outputs.bins == 'true'
      shell: bash
      env:
        PROOF_API_HIT: ${{ steps.cache-proof-api.outputs.cache-hit }}
        OPERATOR_HIT: ${{ steps.cache-operator.outputs.cache-hit }}
      run: |
        args=() bins=()
        if [[ "$PROOF_API_HIT" != 'true' ]]; then args+=(--bin proof-api); bins+=(proof-api); fi
        if [[ "$OPERATOR_HIT" != 'true' ]]; then args+=(--bin operator); bins+=(operator); fi
        cargo build --release --locked "${args[@]}"
        mkdir -p ~/.cargo/bin
        for bin in "${bins[@]}"; do cp "target/release/$bin" ~/.cargo/bin/; done

    - name: Setup Solana and Anchor
      if: inputs.component == 'solana' && steps.cache-solana.outputs.cache-hit != 'true'
      uses: solana-developers/github-actions/setup-all@860d4e7d3afc9f180f3c5016593a1e86e77eede4 # v0.2.5
      with:
        anchor_version: ${{ env.ANCHOR_VERSION }}
        solana_version: ${{ env.SOLANA_VERSION }}

    # A restore-keys fallback brings back an older target/deploy; clear it so programs
    # that were since removed or renamed don't end up in the packaged artifacts. This
    # matches a cold build: program IDs come from declare_id!, and E2E deploys with the
    # tracked solana-keypairs/localnet/, so the keypairs Anchor regenerates here are unused.
    - name: Build Solana Programs
      if: inputs.component == 'solana' && steps.cache-solana.outputs.cache-hit != 'true'
      shell: bash
      run: |
        rm -rf ibc-solana/target/deploy
        just solana::build-solana-programs

    - name: Save Solana Programs
      if: inputs.component == 'solana' && github.ref == 'refs/heads/main' && steps.cache-solana.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ./ibc-solana/target/deploy/
          ./ibc-solana/target/sbpf-solana-solana/
        key: ${{ steps.cache-solana.outputs.cache-primary-key }}

    - name: Package artifacts
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
      run: |
        if [[ "$COMPONENT" == 'rust' ]]; then
          mkdir -p e2e-artifacts/bin e2e-artifacts/sp1-programs
          cp ~/.cargo/bin/proof-api e2e-artifacts/bin/
          cp ~/.cargo/bin/operator e2e-artifacts/bin/
          cp -r ibc-solidity/programs/sp1-programs/target/elf-compilation/riscv64im-succinct-zkvm-elf/release/* e2e-artifacts/sp1-programs/
        else
          mkdir -p e2e-artifacts/solana-programs
          cp -r ibc-solana/target/deploy/* e2e-artifacts/solana-programs/
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: e2e-build-artifacts-${{ inputs.component }}
        path: e2e-artifacts/
        retention-days: 1

# SPDX-License-Identifier: Apache-2.0

name: e2e-mock
on:
  workflow_dispatch:
    inputs:
      ibc-go-docker-tag:
        description: 'ibc-go Docker image tag'
        type: string
        required: false
        default: 'v11.0.0'
  pull_request:
    paths:
      - 'justfile'
      - 'ibc-solidity/solidity.just'
      - '**.rs'
      - '**.go'
      - '**.toml'
      - '**.lock'
      - '**.mod'
      - '**.sum'
      - '**.sol'
      - '.github/workflows/e2e-mock.yml'
      - '.github/actions/**'
      - 'ibc-solidity/bun.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci
  SP1_PROVER: mock
  E2E_PROOF_TYPE: groth16
  SP1_VERSION: "6.1.0"
  SOLANA_VERSION: "2.3.13"
  ANCHOR_VERSION: "0.32.1"
  E2E_IBC_GO_DOCKER_TAG: ${{ inputs.ibc-go-docker-tag || 'v11.0.0' }}

permissions: {}

jobs:
  golangci:
    name: lint
    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          cache-dependency-path: e2e/interchaintestv8/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11
          working-directory: e2e/interchaintestv8

  generate-matrix:
    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.get-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Generate Test Matrix
        id: get-matrix
        uses: ./.github/actions/e2e-matrix
        with:
          skip-tests: TestWithProofAPITestSuite/Test_2_ConcurrentRecvPacketToEth,TestWithProofAPITestSuite/Test_MultiPeriodClientUpdateToCosmos,TestWithProofAPITestSuite/Test_5_FinalizedTimeoutPacketFromEth,TestWithProofAPITestSuite/Test_UpdateClientToCosmos,TestWithEthToEthAttestedTestSuite,TestWithMultiAttestorTestSuite

  build-e2e-programs:
    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build E2E artifacts
        uses: ./.github/actions/e2e-build
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    needs: [generate-matrix, build-e2e-programs]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    name: ${{ matrix.entrypoint }}/${{ matrix.test }}
    env:
        ETH_TESTNET_TYPE: anvil
        ETH_LC_ON_COSMOS: dummy
        COSMOS_LC_ON_ETH: sp1
        IBC_ATTESTOR_IMAGE: ghcr.io/cosmos/ibc-attestor:v0.3.0

    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up E2E environment
        uses: ./.github/actions/e2e-setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Tests
        env:
          NETWORK_PRIVATE_KEY: ${{ secrets.SP1_PRIVATE_KEY }}
        run: |
          cd e2e/interchaintestv8
          go test -v -mod=readonly . -run "^${{ matrix.entrypoint }}$/${{ matrix.test }}$" -timeout 40m

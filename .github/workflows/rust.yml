# Based on https://github.com/actions-rs/example/blob/master/.github/workflows/quickstart.yml
name: rust

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**.rs'
      - '**.toml'
      - '**.lock'
      - '**.proto'
      - 'ibc-solidity/abi/**'
      - '.github/workflows/rust.yml'

# Cancel superseded runs on pull requests. Other events get a group of their own (run_id):
# a shared group would still cancel pending runs on main, losing coverage uploads and cache saves.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lints:
    name: fmt-and-clippy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up environment
        uses: ./.github/actions/foundry-setup

      - name: Run cargo fmt
        uses: actions-rs/cargo@844f36862e911db73fe0815f00a4a2602c279505 # v1.0.3
        with:
          command: fmt
          args: --all -- --check
      - name: Run cargo clippy
        uses: actions-rs/cargo@844f36862e911db73fe0815f00a4a2602c279505 # v1.0.3
        with:
          command: clippy

      # cw-ics08-wasm-eth is its own workspace (separate Cargo.lock), so the root
      # fmt/clippy above do not reach it. Lint it explicitly from its directory.
      - name: Run cargo fmt and clippy (cw-ics08-wasm-eth)
        run: |
          cd ibc-solidity/programs/cw-ics08-wasm-eth
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings

  tests:
    name: unit-tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up environment
        uses: ./.github/actions/foundry-setup

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@c3076e6fa5aeb9a93daf1bd8eff73345250a8a9c # cargo-llvm-cov
      - name: Run unit tests with coverage
        run: just coverage-cargo
        env:
          RUST_BACKTRACE: 1
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info,lcov-cw.info
          flags: rust
          use_oidc: true

  build-proof-api:
    name: build-proof-api
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up environment
        uses: ./.github/actions/foundry-setup
      # Restore-only: e2e-build (via e2e-minimal on main) writes this entry with both
      # binaries, from the same workspace-level `cargo build --bin` as here and the Dockerfile.
      - name: Restore Rust build state
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-bins
          cache-bin: false
          save-if: false
      - name: Build
        run: cargo build --bin proof-api --release --locked

  build-operator:
    name: build-operator
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up environment
        uses: ./.github/actions/foundry-setup
      # Restore-only: e2e-build (via e2e-minimal on main) writes this entry with both
      # binaries, from the same workspace-level `cargo build --bin` as here and the Dockerfile.
      - name: Restore Rust build state
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-bins
          cache-bin: false
          save-if: false
      - name: Build
        run: cargo build --bin operator --release --locked

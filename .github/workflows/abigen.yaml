# SPDX-License-Identifier: Apache-2.0

name: abigen

permissions: {}

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ibc-solidity/abi/**'
      - 'packages/go-abigen/**'
      - '**.sol'
      - 'ibc-solidity/bun.lock'
  push:
    branches:
      - main
    paths:
      - 'ibc-solidity/abi/**'
      - 'packages/go-abigen/**'

jobs:
  check:
    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up environment
        uses: ./.github/actions/foundry-setup

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.25.9

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0

      - name: Install abigen
        run: go install github.com/ethereum/go-ethereum/cmd/abigen@latest

      - name: Run abigen
        run: just solidity::generate-abi

      - name: Check for diffs in go-abigen
        run: |
          if ! git diff --quiet HEAD -- packages/go-abigen; then
            echo "Git diff found in the selected directory. Failing the job."
            exit 1
          else
            echo "No changes detected in the selected directory."
          fi

  golangci:
    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.25.9
          cache-dependency-path: packages/go-abigen/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11
          working-directory: packages/go-abigen

  test:
    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.25.9
          cache-dependency-path: packages/go-abigen/go.sum

      - name: Unit test abigen
        run: cd packages/go-abigen && go test -v ./...

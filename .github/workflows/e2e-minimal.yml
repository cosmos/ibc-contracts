name: e2e-minimal
on:
  workflow_dispatch:
    inputs:
      wasm-eth-light-client-tag:
        description: 'Wasm Eth light client release tag'
        type: choice
        required: true
        default: 'local'
        options:
          - local
          - cw-ics08-wasm-eth-v1.3.0
      proof-type:
        description: 'Proof type'
        type: choice
        required: true
        default: 'groth16'
        options:
          - groth16
          - plonk
      ibc-go-docker-tag:
        description: 'ibc-go Docker image tag'
        type: string
        required: false
        default: 'v11.0.0'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci
  ETH_TESTNET_TYPE: pos
  SP1_PROVER: network
  ETHEREUM_POS_NETWORK_PRESET: minimal
  E2E_PROOF_TYPE: ${{ inputs.proof-type || 'groth16' }}
  E2E_PRIVATE_CLUSTER: true
  E2E_WASM_LIGHT_CLIENT_TAG: ${{ inputs.wasm-eth-light-client-tag }}
  ETH_LC_ON_COSMOS: full
  COSMOS_LC_ON_ETH: sp1
  SP1_VERSION: "6.1.0"
  SOLANA_VERSION: "2.3.13"
  ANCHOR_VERSION: "0.32.1"
  E2E_IBC_GO_DOCKER_TAG: ${{ inputs.ibc-go-docker-tag || 'v11.0.0' }}
permissions:
  contents: read
  packages: read

jobs:
  generate-matrix:
    runs-on: depot-ubuntu-24.04-4
    outputs:
      matrix: ${{ steps.get-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Generate Test Matrix
        id: get-matrix
        uses: ./.github/actions/e2e-matrix
        with:
          skip-tests: TestWithProofAPITestSuite/Test_2_ConcurrentRecvPacketToEth,TestWithMultiAttestorTestSuite,TestWithEthToEthAttestedTestSuite,TestWithEthereumSolanaIFTTestSuite

  build-e2e-programs:
    runs-on: depot-ubuntu-24.04-4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build E2E artifacts
        uses: ./.github/actions/e2e-build
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    needs: [generate-matrix, build-e2e-programs]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    name: ${{ matrix.entrypoint }}/${{ matrix.test }}
    runs-on: depot-ubuntu-24.04-4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up E2E environment
        uses: ./.github/actions/e2e-setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Tests
        env:
          NETWORK_PRIVATE_KEY: ${{ secrets.SP1_PRIVATE_KEY }}
        run: |
          cd e2e/interchaintestv8
          go test -v -mod=readonly . -run "^${{ matrix.entrypoint }}$/${{ matrix.test }}$" -timeout 60m

services:
  validator1:
    image: hyperledger/besu:26.4.0
    environment:
      BESU_OPTS: -Xms128m -Xmx512m -XX:ActiveProcessorCount=2
    command:
      - --config-file=/opt/besu/config.toml
      - --identity=validator1
      - --p2p-host=10.42.0.2
      - --p2p-port=30303
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/30303"]
      interval: 1s
      retries: 120
    volumes:
      - ./config.toml:/opt/besu/config.toml:ro
      - ./genesis.json:/opt/besu/genesis.json:ro
      - ./keys/validator1/key:/opt/besu/key:ro
      - ./static-nodes/validator1.json:/opt/besu/static-nodes.json:ro
      - validator1-data:/opt/besu/data
    ports:
      - "8545"
    networks:
      qbft_testnet:
        ipv4_address: 10.42.0.2

  validator2:
    image: hyperledger/besu:26.4.0
    environment:
      BESU_OPTS: -Xms128m -Xmx512m -XX:ActiveProcessorCount=2
    command:
      - --config-file=/opt/besu/config.toml
      - --identity=validator2
      - --p2p-host=10.42.0.3
      - --p2p-port=30304
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/30304"]
      interval: 1s
      retries: 120
    depends_on:
      validator1:
        condition: service_healthy
    volumes:
      - ./config.toml:/opt/besu/config.toml:ro
      - ./genesis.json:/opt/besu/genesis.json:ro
      - ./keys/validator2/key:/opt/besu/key:ro
      - ./static-nodes/validator2.json:/opt/besu/static-nodes.json:ro
      - validator2-data:/opt/besu/data
    networks:
      qbft_testnet:
        ipv4_address: 10.42.0.3

  validator3:
    image: hyperledger/besu:26.4.0
    environment:
      BESU_OPTS: -Xms128m -Xmx512m -XX:ActiveProcessorCount=2
    command:
      - --config-file=/opt/besu/config.toml
      - --identity=validator3
      - --p2p-host=10.42.0.4
      - --p2p-port=30305
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/30305"]
      interval: 1s
      retries: 120
    depends_on:
      validator2:
        condition: service_healthy
    volumes:
      - ./config.toml:/opt/besu/config.toml:ro
      - ./genesis.json:/opt/besu/genesis.json:ro
      - ./keys/validator3/key:/opt/besu/key:ro
      - ./static-nodes/validator3.json:/opt/besu/static-nodes.json:ro
      - validator3-data:/opt/besu/data
    networks:
      qbft_testnet:
        ipv4_address: 10.42.0.4

  validator4:
    image: hyperledger/besu:26.4.0
    environment:
      BESU_OPTS: -Xms128m -Xmx512m -XX:ActiveProcessorCount=2
    command:
      - --config-file=/opt/besu/config.toml
      - --identity=validator4
      - --p2p-host=10.42.0.5
      - --p2p-port=30306
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/30306"]
      interval: 1s
      retries: 120
    depends_on:
      validator3:
        condition: service_healthy
    volumes:
      - ./config.toml:/opt/besu/config.toml:ro
      - ./genesis.json:/opt/besu/genesis.json:ro
      - ./keys/validator4/key:/opt/besu/key:ro
      - ./static-nodes/validator4.json:/opt/besu/static-nodes.json:ro
      - validator4-data:/opt/besu/data
    networks:
      qbft_testnet:
        ipv4_address: 10.42.0.5

  # Not a genesis validator. Only started on demand, to be voted into the validator set.
  validator5:
    image: hyperledger/besu:26.4.0
    profiles: ["spare"]
    environment:
      BESU_OPTS: -Xms128m -Xmx512m -XX:ActiveProcessorCount=2
    command:
      - --config-file=/opt/besu/config.toml
      - --identity=validator5
      - --p2p-host=10.42.0.6
      - --p2p-port=30307
    volumes:
      - ./config.toml:/opt/besu/config.toml:ro
      - ./genesis.json:/opt/besu/genesis.json:ro
      - ./keys/validator5/key:/opt/besu/key:ro
      - ./static-nodes/validator5.json:/opt/besu/static-nodes.json:ro
      - validator5-data:/opt/besu/data
    networks:
      qbft_testnet:
        ipv4_address: 10.42.0.6

networks:
  qbft_testnet:
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: "false"
    ipam:
      driver: default
      config:
        - subnet: 10.42.0.0/16
          gateway: 10.42.0.1

volumes:
  validator1-data:
  validator2-data:
  validator3-data:
  validator4-data:
  validator5-data:

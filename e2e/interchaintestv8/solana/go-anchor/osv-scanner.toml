# Vulnerabilities that cannot be fixed by a dependency bump and have been
# reviewed for this repository. Read by osv-scanner and OpenSSF Scorecard,
# which only apply this file to manifests in the same directory.
#
# Edit only the root osv-scanner.toml, then copy it over the identical copies
# next to every other manifest (ibc-solana/, ibc-solidity/,
# ibc-solidity/programs/sp1-programs/, ibc-solidity/programs/cw-ics08-wasm-eth/,
# e2e/interchaintestv8/, e2e/interchaintestv8/solana/go-anchor/,
# packages/go-abigen/, packages/go-anchor/, packages/go-proto/,
# scripts/go-test-matrix/, tools/compute-ift-addresses/, tools/solana-ibc/).
# They are copies rather than symlinks because Scorecard skips symlinks.
#
# Re-review each entry when the upstream dependency is upgraded.

# --- Go ---------------------------------------------------------------------


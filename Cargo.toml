[workspace]
members = [
    # Packages
    "packages/solidity",
    "packages/utils",
    "packages/constrained_types",
    "packages/ethereum/light-client",
    "packages/ethereum/trie-db",
    "packages/ethereum/types",
    "packages/ethereum/apis",
    "packages/ethereum/tree_hash",
    "packages/tendermint-light-client/update-client",
    "packages/tendermint-light-client/membership",
    "packages/tendermint-light-client/misbehaviour",
    "packages/tendermint-light-client/uc-and-membership",
    "packages/tendermint-light-client/solana",
    "packages/proof-api/lib",
    "packages/proof-api/core",
    "packages/proof-api/modules/eth-to-cosmos",
    "packages/proof-api/modules/eth-to-cosmos-compat",
    "packages/proof-api/modules/cosmos-to-eth",
    "packages/proof-api/modules/eth-to-eth",
    "packages/proof-api/modules/besu-to-besu",
    "packages/proof-api/modules/cosmos-to-cosmos",
    "packages/proof-api/modules/solana-to-cosmos",
    "packages/proof-api/modules/cosmos-to-solana",
    "packages/proof-api/modules/eth-to-solana",
    "packages/proof-api/modules/solana-to-eth",
    "packages/sp1-ics07-tendermint-prover",

    # Programs (binaries)
    "programs/proof-api",
    "ibc-solidity/programs/operator",
    # NOTE: `ibc-solidity/programs/cw-ics08-wasm-eth` is intentionally NOT a member here.
    # It is its own workspace (with its own Cargo.lock) so its dependencies can be pinned
    # to versions compatible with the older Rust toolchain that CosmWasm requires, without
    # constraining the rest of this workspace. See that directory's Cargo.toml.
]
# `ibc-solana` is its own workspace (own Cargo.lock, pinned to the Rust toolchain Anchor
# requires). Without this exclude, its packages get pulled into this workspace as members
# (they are path dependencies of `packages/tendermint-light-client/solana`), which makes
# `cargo test --all` build and run their tests under this workspace's toolchain instead of
# the one they are pinned to. They are still usable as path dependencies while excluded.
exclude = ["ibc-solana"]
resolver = "2"

[workspace.lints]

[workspace.package]
version    = "0.1.0"
edition    = "2021"
license    = "Apache-2.0"
repository = "https://github.com/cosmos/solidity-ibc-eureka"
keywords   = ["cosmos", "ibc", "sp1", "tendermint", "ethereum", "bridge", "solidity", "eureka"]

[workspace.dependencies]
ibc-eureka-solidity-types               = { path = "packages/solidity", default-features = false }
proof-api-lib                  = { path = "packages/proof-api/lib", default-features = false }
proof-api-core                 = { path = "packages/proof-api/core", default-features = false }
proof-api-eth-to-cosmos        = { path = "packages/proof-api/modules/eth-to-cosmos", default-features = false }
proof-api-eth-to-cosmos-compat = { path = "packages/proof-api/modules/eth-to-cosmos-compat", default-features = false }
proof-api-cosmos-to-eth        = { path = "packages/proof-api/modules/cosmos-to-eth", default-features = false }
proof-api-eth-to-eth           = { path = "packages/proof-api/modules/eth-to-eth", default-features = false }
proof-api-besu-to-besu         = { path = "packages/proof-api/modules/besu-to-besu", default-features = false }
proof-api-cosmos-to-cosmos     = { path = "packages/proof-api/modules/cosmos-to-cosmos", default-features = false }
proof-api-solana-to-cosmos     = { path = "packages/proof-api/modules/solana-to-cosmos", default-features = false }
proof-api-cosmos-to-solana     = { path = "packages/proof-api/modules/cosmos-to-solana", default-features = false }
proof-api-eth-to-solana        = { path = "packages/proof-api/modules/eth-to-solana", default-features = false }
proof-api-solana-to-eth        = { path = "packages/proof-api/modules/solana-to-eth", default-features = false }
ibc-eureka-utils                        = { path = "packages/utils", default-features = false }
ibc-eureka-constrained-types            = { path = "packages/constrained_types", default-features = false }
sp1-ics07-tendermint-prover             = { path = "packages/sp1-ics07-tendermint-prover", default-features = false }
sp1-ics07-tendermint-update-client      = { path = "ibc-solidity/programs/sp1-programs/update-client", default-features = false }
sp1-ics07-tendermint-membership         = { path = "ibc-solidity/programs/sp1-programs/membership", default-features = false }
sp1-ics07-utils                         = { path = "ibc-solidity/programs/sp1-programs/utils" }
ethereum-trie-db                        = { path = "packages/ethereum/trie-db", default-features = false }
ethereum-light-client                   = { path = "packages/ethereum/light-client", default-features = false }
ethereum-types                          = { path = "packages/ethereum/types", default-features = false }
ethereum-apis                           = { path = "packages/ethereum/apis", default-features = false }
tree_hash                               = { path = "packages/ethereum/tree_hash", default-features = false }

tendermint-light-client-update-client     = { path = "packages/tendermint-light-client/update-client", default-features = false }
tendermint-light-client-membership        = { path = "packages/tendermint-light-client/membership", default-features = false }
tendermint-light-client-misbehaviour      = { path = "packages/tendermint-light-client/misbehaviour", default-features = false }
tendermint-light-client-uc-and-membership = { path = "packages/tendermint-light-client/uc-and-membership", default-features = false }
tendermint-light-client-solana            = { path = "packages/tendermint-light-client/solana", default-features = false }

brine-ed25519 = { version = "0.2", default-features = false }
ed25519-dalek = { version = "2.0", default-features = false }

serde           = { version = "1.0", default-features = false }
serde_json      = { version = "1.0", default-features = false }
serde_with      = { version = "3.11", default-features = false }
hex             = { version = "0.4", default-features = false }
base64          = { version = "0.22", default-features = false }
prost           = { version = "0.13", default-features = false }
prost-build     = { version = "0.13", default-features = false }
# Solana workspace uses borsh 0.10.4 for Anchor compatibility (Anchor 0.31.1 requires that version).
borsh           = { version = "1.5.7", default-features = false }
subtle-encoding = { version = "0.5", default-features = false }
schemars        = { version = "0.8", default-features = false }

sha2      = { version = "0.10", default-features = false }
sha3      = { version = "0.10", default-features = false }
k256      = { version = "0.13.4", default-features = false }
secp256k1 = { version = "0.31.1", default-features = false, features = ["recovery"] }
rand      = { version = "0.9", default-features = false }

tokio            = { version = "1.0", default-features = false }
tokio-stream     = { version = "0.1", default-features = false }
tower-http       = { version = "0.6.6", default-features = false }
tonic            = { version = "0.13", default-features = false }
tonic-web        = { version = "0.13", default-features = false }
tonic-build      = { version = "0.13", default-features = false }
tonic-reflection = { version = "0.13", default-features = false }
warp             = { version = "0.4", default-features = false }

prometheus           = { version = "0.14", default-features = false }
tracing              = { version = "0.1", default-features = false }
tracing-subscriber   = { version = "0.3", default-features = false }
anyhow               = { version = "1.0", default-features = false }
async-trait        = { version = "0.1", default-features = false }
futures            = { version = "0.3", default-features = false }
futures-timer      = { version = "3.0", default-features = false }
clap               = { version = "4.5", default-features = false, features = ["std"] } # std feature is required for clap
time               = { version = "0.3", default-features = false }
dotenv             = { version = "0.15", default-features = false }
thiserror          = { version = "2.0", default-features = false }
url                = { version = "2.5.7", default-features = false }
reqwest            = { version = "0.12", default-features = false }
reqwest_0_11       = { package = "reqwest", version = "0.11", default-features = false }
indexmap           = { version = "2.10.0", default-features = false }

# Ensure `alloc` is enabled for ed25519-zebra so cosmwasm-crypto can import its batch module
ed25519-zebra      = { version = "4.1.0", default-features = false, features = ["alloc"] }

tendermint                       = { version = "0.40", default-features = false }
tendermint-testgen               = { version = "0.40", default-features = false }
tendermint-rpc                   = { version = "0.40", default-features = false }
tendermint-light-client-verifier = { version = "0.40", default-features = false }
tendermint-proto                 = { version = "0.40", default-features = false }

cosmos-sdk-proto = { version = "0.26", default-features = false }
ibc-proto        = { version = "0.51", default-features = false }
ibc-proto-eureka = { package = "ibc-proto", git = "https://github.com/srdtrk/ibc-proto-rs", rev = "3613891e18478811216cce02dc867b7c6ff8811b", default-features = false }
ics23            = { version = "0.12", default-features = false }

ibc                         = { version = "0.57", default-features = false }
ibc-client-tendermint       = { version = "0.57", default-features = false }
ibc-client-tendermint-types = { version = "0.57", default-features = false }
ibc-core-client             = { version = "0.57", default-features = false }
ibc-core-host-types         = { version = "0.57", default-features = false }
ibc-core-client-types       = { version = "0.57", default-features = false }
ibc-core-commitment-types   = { version = "0.57", default-features = false }

ibc-primitives              = { version = "0.57", default-features = false }

alloy                  = { version = "2.0", default-features = false }
alloy-contract         = { version = "2.0", default-features = false }
alloy-sol-types        = { version = "1.5", default-features = false }
alloy-primitives       = { version = "1.5", default-features = false }
alloy-serde            = { version = "2.0", default-features = false }
alloy-network          = { version = "2.0", default-features = false }
alloy-signer-local     = { version = "2.0", default-features = false }
alloy-signer           = { version = "2.0", default-features = false }
alloy-rlp              = { version = "0.3", default-features = false }
alloy-rpc-client       = { version = "2.0", default-features = false }
alloy-provider         = { version = "2.0", default-features = false }
alloy-transport        = { version = "2.0", default-features = false }
alloy-rpc-types-eth    = { version = "2.0", default-features = false }

sp1-sdk  = { version = "6.1", default-features = false }
sp1-cuda = { version = "6.1", default-features = false }

# NOTE: When updating, use `cargo update -p ed25519-zebra --precise 4.0.3` to avoid pulling in a version that conflicts with cosmwasm-crypto
cosmwasm-schema = { version = "2.2", default-features = false }
cosmwasm-std    = { version = "2.2", default-features = false }
cw2             = { version = "2.0", default-features = false }

moka = { version = "0.12", features = ["future"] }
uuid = { version = "1.18", default-features = false }

# OpenTelemetry
opentelemetry =         { version = "0.30", default-features = false }
opentelemetry-otlp =    { version = "0.30", default-features = false }
opentelemetry_sdk =     { version = "0.30", default-features = false }
tracing-opentelemetry = { version = "0.31", default-features = false }

# The dependencies below are maintained by Sigma Prime (for use in Lighthouse (and the broader Ethereum ecosystem))
ethereum_ssz        = { version = "0.10", default-features = false }
ethereum_ssz_derive = { version = "0.10", default-features = false }
tree_hash_derive    = { version = "0.11", default-features = false }

# The dependencies below are maintained by Parity Tech
trie-db            = { version = "0.30", default-features = false }
hash-db            = { version = "0.16", default-features = false }
memory-db          = { version = "0.34", default-features = false }
hash256-std-hasher = { version = "0.15", default-features = false }
rlp                = { version = "0.6", default-features = false }
rlp-derive         = { version = "0.2", default-features = false }
primitive-types    = { version = "0.14", default-features = false }

# test/dev-dependencies
rstest                       = { version = "0.26", default-features = false }
milagro_bls                  = { git = "https://github.com/Snowfork/milagro_bls", rev = "bc2b5b5e8d48b7e2e1bfaa56dc2d93e13cb32095", default-features = false }                                           # Only used for testing, not to be used in production!
smallvec                     = { version = "1.6.1", default-features = false }
tempfile                     = { version = "3.8.1", default-features = false }

# TODO: Remove these dependencies once ethereum wasm client v1.3.0 backwards compatibility is not needed.
ibc-eureka-relayer-eth-to-cosmos-v1_3 = { package = "ibc-eureka-relayer-eth-to-cosmos", git = "https://github.com/cosmos/solidity-ibc-eureka", rev = "035aa5eb171b6608614a9bc4e76e79d61c190e39", default-features = false }
ibc-eureka-relayer-core-v1_3          = { package = "ibc-eureka-relayer-core", git = "https://github.com/cosmos/solidity-ibc-eureka", rev = "035aa5eb171b6608614a9bc4e76e79d61c190e39", default-features = false }

# Solana dependencies
solana-client             = { version = "2.0" }
solana-sdk                = { version = "2.0" }
solana-commitment-config = { version = "2.2.1", default-features = false }
solana-transaction-status = { version = "2.0" }
bincode                   = { version = "1.3" }
anchor-lang               = { version = "0.32.1" }
anchor-client             = { version = "0.32.1" }

solana-account-info   = { version = "2.2", default-features = false }
solana-pubkey         = { version = "2.2", default-features = false, features = ["sha2", "curve25519"] }
solana-sha256-hasher  = { version = "2.2", default-features = false }
solana-keccak-hasher  = { version = "2.2", default-features = false }
solana-msg            = { version = "2.2", default-features = false }

[patch.crates-io]
# TODO: remove on publish of verifier with &self in verify method
tendermint.git = "https://github.com/cometbft/tendermint-rs"
tendermint-proto.git = "https://github.com/cometbft/tendermint-rs"
tendermint-light-client-verifier.git = "https://github.com/cometbft/tendermint-rs"
tendermint-config.git = "https://github.com/cometbft/tendermint-rs"
tendermint-rpc.git = "https://github.com/cometbft/tendermint-rs"
tendermint-testgen.git = "https://github.com/cometbft/tendermint-rs"

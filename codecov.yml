# Each flag is uploaded by a separate workflow, and rust.yml only runs on PRs that touch Rust.
# Carry forward the last uploaded report so PRs that skip a workflow don't lose its coverage.
flag_management:
  default_rules:
    carryforward: true

# Exclude prover, RPC and binding plumbing that is exercised by e2e tests, not unit tests.
ignore:
  - "packages/proof-api/**"
  - "programs/proof-api/**"
  - "packages/utils/**"
  - "packages/sp1-ics07-tendermint-prover/**"
  - "packages/solidity/**"
  - "ibc-solidity/programs/operator/**"

[package]
edition = "2021"
rust-version = "1.91"
name = "sp1-lib"
version = "6.1.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "SP1 zkVM library functions"
readme = "README.md"
keywords = [
    "sp1",
    "succinct",
    "zero-knowledge",
    "zkvm",
]
categories = ["cryptography"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/succinctlabs/sp1"

[features]
default = ["ecdsa"]
ecdsa = ["dep:elliptic-curve"]
verify = []

[lib]
name = "sp1_lib"
path = "src/lib.rs"

[dependencies.bincode]
version = "1.3.3"

[dependencies.elliptic-curve]
version = "0.13.8"
features = [
    "hazmat",
    "sec1",
    "ecdh",
]
optional = true

[dependencies.serde]
version = "1.0.204"
features = [
    "derive",
    "derive",
]

[dependencies.sp1-primitives]
version = "=6.1.0"

[lints.clippy]
print_stdout = "deny"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(sp1_debug_constraints)",
    "cfg(sp1_debug_global_memory)",
    "cfg(sp1_core_runner_override)",
    "cfg(sp1_use_native_executor)",

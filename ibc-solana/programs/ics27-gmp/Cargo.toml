[package]
name = "ics27-gmp"
version.workspace = true
description = "ICS27 General Message Passing (GMP) for Solana"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../../README.md"
keywords = ["cosmos", "ibc", "solana", "gmp", "anchor"]
categories = ["cryptography", "blockchain"]

[lib]
crate-type = ["cdylib", "lib"]
name = "ics27_gmp"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }
solana-ibc-types.workspace = true
solana-ibc-constants.workspace = true
solana-ibc-proto.workspace = true
solana-ibc-macros.workspace = true
ics26-router = { workspace = true, features = ["cpi"] }
access-manager = { workspace = true, features = ["cpi"] }
alloy-sol-types.workspace = true


[dev-dependencies]
mollusk-svm.workspace = true
mollusk-svm-bencher.workspace = true
solana-sdk = { workspace = true, features = ["full"] }
solana-program-test.workspace = true
bincode.workspace = true
test-gmp-app = { workspace = true, features = ["cpi"] }
rstest.workspace = true
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
